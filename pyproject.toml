[project]
name = "urlab-bridge"
version = "0.1.0-alpha"
description = "ZMQ bridge and policy runner for Unreal Robotics Lab"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Jonathan Embley-Riches", email = "jonathanembleyriches@outlook.com"}]
urls = {Homepage = "https://github.com/URLab-Sim/urlab_bridge", Documentation = "https://github.com/URLab-Sim/UnrealRoboticsLab"}
dependencies = [
    "pyzmq>=25.0.0",
    "numpy>=1.26.0",
    # URLab remote-stepping client (section 6 of plan_remote_stepping.md):
    # MuJoCo version pinned to URLab's submodule build (third_party/MuJoCo
    # currently at 3.11.1). 3.11.0 is the newest PyPI release, so the pin is
    # one patch behind the plugin on purpose: the handshake compares
    # major.minor, and a patch-level skew falls back to the compiled-XML
    # model rather than the version-locked MJB.
    "mujoco==3.11.0",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
# UI: dearpygui shell + opencv for image conversions in the camera /
# recording tabs.
ui = [
    "dearpygui>=1.11.1",
    "opencv-python>=4.8.0",
]
# Base policy stack: the native / WalkTheseWays runners need torch, and the
# gym env adapter needs gymnasium. Kept out of the core deps so a client that
# only drives UE over RPC installs neither. robojudo / mjlab build on this.
policy = [
    "torch>=2.0.0",
    "gymnasium>=1.0.0",
]
# RoboJuDo policy stack. The local ./RoboJuDo submodule is bound via the
# [tool.uv.sources] section below; uv sync --extra robojudo installs it
# editable alongside the listed deps. Don't `pip install -e ./RoboJuDo`
# separately -- the next `uv sync` will drop it because uv enforces the
# lock against pyproject. Use the extra.
robojudo = [
    "urlab-bridge[policy]",
    "robojudo",
    "onnxruntime>=1.16.0",
    "scipy>=1.11.0",
    "pydantic>=2.0.0",
    "python-box>=7.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "easydict>=1.10",
    "msgpack-numpy>=0.4.8",
    "colorlog>=6.7.0",
    "joblib>=1.3.0",
]
# mjlab eval-time runner.
# mujoco-warp is pinned explicitly because mjlab transitively brings an
# older one, which references `mujoco.mjtEnableBit.mjENBL_MULTICCD` -- a
# value removed in mujoco 3.8.x. With the bridge pinned to mujoco 3.11.0
# the import-time enum lookup fails with AttributeError and the mjlab
# registry is silently skipped. mujoco-warp 3.11.0 has the matching API.
mjlab = [
    "urlab-bridge[policy]",
    "mjlab",
    "mujoco-warp==3.11.0",
]
dev = [
    "pytest>=9.0.3",
    "ruff",
]

[project.scripts]
urlab-ui     = "urlab_bridge.cli.ui:main"
urlab-ping   = "urlab_bridge.cli.ping:main"
urlab-test   = "urlab_bridge.cli.test:main"
urlab-policy = "urlab_bridge.cli.policy:main"
urlab-farm   = "urlab_farm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# Bind the `robojudo` requirement (listed in [project.optional-dependencies]
# robojudo) to the in-tree submodule path, editable. Without this, uv would
# look for `robojudo` on PyPI (where it doesn't exist) and fail to resolve
# the extra. With this, `uv sync --extra robojudo` builds + installs the
# submodule and survives subsequent `uv sync` calls.
robojudo = { path = "./RoboJuDo", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/urlab_bridge",
    "src/urlab_client",
    "src/urlab_policy",
    "src/urlab_dashboard",
    "src/urlab_farm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

